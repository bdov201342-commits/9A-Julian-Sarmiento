<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú · Millonarios FC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        @keyframes shine {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0e1a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background:
                radial-gradient(1px 1px at 10% 20%, rgba(255,255,255,0.6), transparent),
                radial-gradient(1px 1px at 30% 60%, rgba(255,255,255,0.5), transparent),
                radial-gradient(1.5px 1.5px at 50% 10%, rgba(255,255,255,0.7), transparent),
                radial-gradient(1px 1px at 70% 40%, rgba(255,255,255,0.4), transparent),
                radial-gradient(1.5px 1.5px at 90% 80%, rgba(255,255,255,0.6), transparent),
                radial-gradient(1px 1px at 20% 90%, rgba(255,255,255,0.5), transparent),
                radial-gradient(1.5px 1.5px at 80% 15%, rgba(255,215,0,0.4), transparent),
                radial-gradient(1px 1px at 45% 75%, rgba(255,255,255,0.3), transparent),
                radial-gradient(1.5px 1.5px at 15% 45%, rgba(255,215,0,0.5), transparent),
                radial-gradient(1px 1px at 65% 55%, rgba(255,255,255,0.4), transparent),
                radial-gradient(1px 1px at 5% 70%, rgba(255,255,255,0.3), transparent),
                radial-gradient(1.5px 1.5px at 55% 30%, rgba(255,215,0,0.3), transparent),
                radial-gradient(1px 1px at 85% 90%, rgba(255,255,255,0.5), transparent),
                radial-gradient(1px 1px at 95% 5%, rgba(255,255,255,0.4), transparent);
            pointer-events: none;
            z-index: 0;
        }

        .page-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 560px;
            animation: slideUp 0.8s ease-out;
        }

        .hero {
            background: linear-gradient(135deg, #001a4d 0%, #0033a0 40%, #002277 100%);
            border-radius: 24px 24px 0 0;
            padding: 25px 35px;
            position: relative;
            overflow: hidden;
            border-bottom: 3px solid #ffd700;
            text-align: center;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(
                45deg,
                transparent,
                transparent 40px,
                rgba(255, 255, 255, 0.02) 40px,
                rgba(255, 255, 255, 0.02) 41px
            );
        }

        .hero-stars {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }

        .hero-stars svg {
            width: 26px;
            height: 26px;
            animation: twinkle 2s ease-in-out infinite;
        }

        .hero-stars svg:nth-child(2) { animation-delay: 0.3s; }
        .hero-stars svg:nth-child(3) { animation-delay: 0.6s; }
        .hero-stars svg:nth-child(4) { animation-delay: 0.9s; }
        .hero-stars svg:nth-child(5) { animation-delay: 1.2s; }

        .hero-title {
            font-size: 26px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;
            background: linear-gradient(90deg, #fff, #ffd700, #fff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 4s linear infinite;
            position: relative;
            z-index: 1;
        }

        .hero-subtitle {
            font-size: 12px;
            color: rgba(255,255,255,0.6);
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-top: 4px;
            position: relative;
            z-index: 1;
        }

        .menu-card {
            background: linear-gradient(180deg, #0f1424 0%, #0a0e1a 100%);
            border-radius: 0 0 24px 24px;
            border: 1px solid rgba(0, 51, 160, 0.3);
            border-top: none;
            padding: 35px;
            box-shadow: 0 20px 80px rgba(0, 0, 0, 0.8);
            text-align: center;
        }

        .menu-card h2 {
            font-size: 20px;
            font-weight: 800;
            color: #ffd700;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }

        .menu-card p {
            font-size: 13px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 28px;
        }

        .btn-menu {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #0033a0, #002277);
            color: #fff;
            border: 1px solid rgba(255, 215, 0, 0.3);
            padding: 15px 32px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            font-family: inherit;
            position: relative;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .btn-menu::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,215,0,0.15), transparent);
            transition: left 0.5s ease;
        }

        .btn-menu:hover::before {
            left: 100%;
        }

        .btn-menu:hover {
            background: linear-gradient(135deg, #0044cc, #0033a0);
            border-color: #ffd700;
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 51, 160, 0.5);
        }

        .btn-menu:active {
            transform: translateY(0);
        }

        .btn-salir {
            display: inline-block;
            background: transparent;
            color: rgba(255,255,255,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 24px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            font-family: inherit;
            margin-top: 12px;
        }

        .btn-salir:hover {
            color: #ffd700;
            border-color: rgba(255,215,0,0.4);
            background: rgba(255,215,0,0.05);
        }

        .footer {
            text-align: center;
            padding: 18px 35px 10px;
            font-size: 10px;
            color: rgba(255,255,255,0.15);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .footer .star {
            color: #ffd700;
        }

        @media (max-width: 480px) {
            .page-wrapper {
                padding: 0;
            }
            .hero {
                padding: 20px;
            }
            .hero-title {
                font-size: 18px;
                letter-spacing: 2px;
            }
            .menu-card {
                padding: 25px 20px;
            }
        }
    </style>
</head>
<body>

<div class="page-wrapper">
    <header class="hero">
        <div class="hero-stars">
            <svg viewBox="0 0 24 24" fill="#ffd700"><polygon points="12,2 15,9 22,9 16,14 18,21 12,17 6,21 8,14 2,9 9,9"/></svg>
            <svg viewBox="0 0 24 24" fill="#ffd700"><polygon points="12,2 15,9 22,9 16,14 18,21 12,17 6,21 8,14 2,9 9,9"/></svg>
            <svg viewBox="0 0 24 24" fill="#ffd700"><polygon points="12,2 15,9 22,9 16,14 18,21 12,17 6,21 8,14 2,9 9,9"/></svg>
            <svg viewBox="0 0 24 24" fill="#ffd700"><polygon points="12,2 15,9 22,9 16,14 18,21 12,17 6,21 8,14 2,9 9,9"/></svg>
            <svg viewBox="0 0 24 24" fill="#ffd700"><polygon points="12,2 15,9 22,9 16,14 18,21 12,17 6,21 8,14 2,9 9,9"/></svg>
        </div>
        <div class="hero-title">Bienvenido</div>
        <div class="hero-subtitle">&#9733; Área de embajadores &#9733;</div>
    </header>

    <div class="menu-card">
        <h2>Menú principal</h2>
        <p id="usuarioTxt">Hola, Embajador</p>

        <a class="btn-menu" href="juego.html">&#9733; Juego HaxBall</a>
        <a class="btn-menu" href="diario.html">&#9733; Diario personal</a>
        <a class="btn-menu" href="tareas.html">&#9733; Lista de tareas</a>

        <a class="btn-salir" href="index.html">&#8592; Cerrar sesión</a>
    </div>

    <div class="footer">
        <span class="star">&#9733;</span> Millonarios FC <span class="star">&#9733;</span> &nbsp;|&nbsp; Hecho con &#9829;
    </div>
</div>

<script>
    document.getElementById('usuarioTxt').textContent = 'Hola, Millonarios. ¡La grandeza se construye!';
</script></body>
</html>
